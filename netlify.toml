[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"

[functions."enrich-lead"]
  timeout = 8

[functions."chat"]
  timeout = 26

[functions."generate-outreach"]
  timeout = 26

[functions."send-linkedin-invite"]
  timeout = 26

[functions."qualify-leads"]
  timeout = 26

[functions."analyse-style"]
  timeout = 26

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# env vars needed: SUPABASE_SERVICE_KEY, CLAUDE_API_KEY
